# Plant Disease Classifier Configuration

# Model settings
model:
  name: "resnet50"          # Options: resnet50, resnet101, efficientnet_b0, efficientnet_b3, vit_base_patch16_224
  pretrained: true
  num_classes: 38           # Number of disease classes (PlantVillage has 38)
  dropout: 0.2
  freeze_backbone: false    # Freeze backbone for transfer learning

# Data settings
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  
  # Normalization (ImageNet stats)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
  # Augmentation
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    rotation: 30
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    cutout: true
    cutout_holes: 8
    cutout_size: 16

# Training settings
training:
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-4
  optimizer: "adamw"        # Options: adamw, sgd, adam
  scheduler: "cosine"       # Options: cosine, step, plateau, onecycle
  warmup_epochs: 5
  early_stopping_patience: 10
  gradient_clip: 1.0
  mixed_precision: true
  seed: 42

# Loss settings
loss:
  name: "cross_entropy"     # Options: cross_entropy, focal, label_smoothing
  label_smoothing: 0.1
  focal_gamma: 2.0
  focal_alpha: 0.25

# Logging
logging:
  use_wandb: false
  project_name: "plant-disease-classifier"
  run_name: null
  log_interval: 10
  save_dir: "checkpoints"
  save_best_only: true

# Inference
inference:
  tta: true                 # Test-time augmentation
  tta_crops: 5